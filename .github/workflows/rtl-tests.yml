name: RTL Verification (Cocotb)

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Fetches submodules if your project uses them

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (Simulator and Cocotb)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb pytest fxpmath numpy matplotlib

      - name: Run all Cocotb tests
        run: |
          # Fail the entire workflow immediately if any command fails
          set -e 
          
          echo "Looking for tests in the tests/ directory..."
          
          # Iterate over each subdirectory inside tests/
          for test_dir in tests/*/; do
            echo "========================================"
            echo "Running tests in: $test_dir"
            echo "========================================"
            
            # Execute make inside that specific folder
            make -C "$test_dir"
          done
        env:
          SIM: icarus # Change this to 'verilator' if you are using it instead